<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flyer AgroPreciosVE</title>
  <style>
    body {
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, sans-serif;
    }
    .flyer {
      width: 380px;
      background: linear-gradient(180deg, #2d5016 0%, #1e360e 100%);
      border-radius: 20px;
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .flyer::before {
      content: "";
      position: absolute;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      background: #8bc34a;
      border-radius: 50%;
      opacity: 0.2;
    }
    .icono {
      width: 120px;
      height: 120px;
      border-radius: 25px;
      margin: 0 auto 15px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: block;
    }
    h1 {
      font-size: 32px;
      margin: 0;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .subtitulo {
      font-size: 16px;
      color: #a4c96d;
      margin: 5px 0 25px 0;
      font-weight: 600;
    }
    .beneficios {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 15px;
      text-align: left;
      font-size: 14px;
      margin-bottom: 25px;
      border-left: 4px solid #ffb300;
    }
    .beneficios p {
      margin: 8px 0;
      display: flex;
      align-items: center;
    }
    .qr-container {
      background: white;
      padding: 15px;
      border-radius: 15px;
      width: 180px;
      margin: 0 auto;
    }
    .qr-container img {
      width: 100%;
      display: block;
    }
    .qr-text {
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
      color: #2d5016;
    }
    .footer {
      font-size: 11px;
      color: #a4c96d;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="flyer">
    <!-- REEMPLAZA EL SRC CON EL ENLACE DE TU ICONO SI LO TIENES EN INTERNET -->
    <img src="icono.png" alt="AgroPreciosVE" class="icono" />
    
    <h1>AgroPreciosVE</h1>
    <p class="subtitulo">El precio justo en tus manos</p>

    <div class="beneficios">
      <p>✅ Precios a puerta de finca</p>
      <p>✅ 8 mercados nacionales</p>
      <p>✅ Registro para agricultores y tiendas</p>
    </div>

    <div class="qr-container">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://agropreciosve.vercel.app" alt="QR Code" />
      <div class="qr-text">Escanea y descárgala</div>
    </div>

    <div class="footer">Un proyecto para el campo venezolano 🇻🇪</div>
  </div>

</body>
</html>
